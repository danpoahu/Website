<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Stone Tablets to Robots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html{color-scheme:light}
:root{--sand:#FFFBEB;--ink:#1E293B;--soft:#64748B;--navy:#1a3c6e;--ocean:#0891B2;--deep:#004E7C;--purple:#7C3AED;--green:#16A34A;--amber:#D97706;--red:#DC2626;--pink:#D63384;--line:#E2E8F0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0B2A40;color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;left:0;right:0;top:0;bottom:58px;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none;background:var(--sand);overflow:hidden;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s ease}
.slide.cur{opacity:1;pointer-events:auto}
[data-s]{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease}
[data-s].on{opacity:1;transform:none}
h1,h2,h3,.k,.yr{font-family:Outfit,system-ui,sans-serif}
.abs{position:absolute}
.k{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ocean)}
.stripe{position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(180deg,var(--ocean),var(--pink))}

/* ---------- covers ---------- */
.cover{background:linear-gradient(135deg,#0B3A53 0%,#0E7490 55%,#1a5f7a 100%);color:#fff}
.cover .brand{position:absolute;left:90px;top:70px;font:600 16px Outfit;letter-spacing:.08em;opacity:.85}
.cover h1{position:absolute;left:90px;top:150px;width:760px;font-size:84px;line-height:1;font-weight:800;letter-spacing:-.02em}
.cover .sub{position:absolute;left:92px;top:380px;width:640px;font-size:25px;line-height:1.35;opacity:.92}
.cover .gate{position:absolute;left:92px;top:500px;display:flex;gap:16px}
.btn{font:600 19px Outfit;border:0;border-radius:999px;padding:15px 28px;cursor:pointer;background:#fff;color:#0B3A53}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.cover .tabletArt{position:absolute;right:70px;top:120px;width:360px}
.waves{position:absolute;left:0;right:0;bottom:0;height:120px}

/* ---------- era slides ---------- */
.artCard{position:absolute;left:56px;top:84px;width:640px;height:520px;border-radius:26px;overflow:hidden;box-shadow:0 12px 30px rgba(15,23,42,.12)}
.artCard svg{width:100%;height:100%;display:block}
.eraTxt{position:absolute;left:750px;top:96px;width:480px}
.eraTxt .yr{font-size:76px;font-weight:800;color:var(--navy);line-height:1;margin:10px 0 14px;letter-spacing:-.02em}
.eraTxt h2{font-size:38px;line-height:1.08;color:var(--ink);font-weight:700;margin-bottom:18px}
.eraTxt p{font-size:23px;line-height:1.4;color:#334155}
.reach{position:absolute;left:750px;top:500px;width:470px}
.reach .lbl{font:700 13px Outfit;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:10px}
.reach .track{display:flex;gap:6px}
.reach .seg{flex:1;height:14px;border-radius:7px;background:#E7E2CF}
.reach .seg.f{background:linear-gradient(90deg,var(--ocean),var(--deep))}
.reach .seg.now{background:linear-gradient(90deg,var(--ocean),var(--pink));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.reach .where{margin-top:10px;font:700 22px Outfit;color:var(--deep)}

/* ---------- map ---------- */
.mapBox{position:absolute;left:400px;top:0;right:0;bottom:0;border-left:1px solid var(--line)}
.mapBox iframe{width:100%;height:100%;border:0;pointer-events:none;display:block}
.mapCard{position:absolute;left:28px;top:60px;width:344px;background:rgba(255,255,255,.95);border-radius:20px;padding:20px 24px;box-shadow:0 12px 34px rgba(15,23,42,.18)}
.mapCard h2{font-size:34px;color:var(--navy);font-weight:800;margin:6px 0 14px}
.stat{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.stat b{font:800 30px Outfit;color:var(--deep);min-width:92px}
.stat span{font-size:18px;color:#334155;line-height:1.2}
.stat.p b{color:var(--purple)}
.mapCard small{display:block;margin-top:14px;color:var(--soft);font-size:15px}

/* ---------- what's new ---------- */
.head{position:absolute;left:64px;top:44px;right:64px}
.head h2{font-size:44px;font-weight:800;color:var(--navy);margin-top:4px}
.head .n{position:absolute;right:0;top:4px;font:700 16px Outfit;color:var(--soft)}
.cards{position:absolute;left:64px;right:64px;top:160px;display:flex;gap:36px}
.card{flex:1;background:#fff;border-radius:22px;box-shadow:0 10px 28px rgba(15,23,42,.10);overflow:hidden;height:470px;display:flex;flex-direction:column}
.mock{height:262px;background:#F1F5F9;position:relative;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.card .tx{padding:20px 26px}
.card h3{font-size:27px;font-weight:700;color:var(--ink);margin-bottom:8px}
.card p{font-size:19.5px;line-height:1.38;color:#475569}
.who{display:inline-block;font:700 12.5px Outfit;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--ocean);border-radius:999px;padding:4px 11px;margin-bottom:10px}
.who.pip{background:var(--purple)}.who.scr{background:var(--green)}.who.fam{background:var(--amber)}
/* mock bits */
.ui{background:#fff;border-radius:14px;box-shadow:0 6px 18px rgba(15,23,42,.12);font-size:15px;color:var(--ink)}
.pb{display:inline-block;border-radius:9px;padding:7px 13px;font:600 14px Outfit;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.pb.t{background:var(--ocean);border-color:var(--ocean);color:#fff}
.pb.g{background:#DCFCE7;border-color:var(--green);color:#166534}
.pb.o{background:var(--amber);border-color:var(--amber);color:#fff}
.chip{display:inline-block;border-radius:999px;padding:4px 11px;font:700 13px Outfit}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* ---------- next ---------- */
.nextList{position:absolute;left:64px;top:140px;width:640px}
.ni{display:flex;gap:18px;align-items:flex-start;margin-bottom:13px}
.ni .ic{flex:none;width:46px;height:46px;border-radius:14px;background:#E0F2FE;color:var(--deep);display:flex;align-items:center;justify-content:center;font:800 18px Outfit}
.ni h3{font-size:22px;font-weight:700;color:var(--ink)}
.ni p{font-size:17px;color:#475569;line-height:1.35;margin-top:2px}
.flyers{position:absolute;left:740px;top:150px;width:490px;height:500px}
.flyer{position:absolute;width:210px;height:290px;background:#fff;border-radius:14px;box-shadow:0 10px 26px rgba(15,23,42,.16);padding:18px;overflow:hidden}
.flyer .fh{font:800 23px Outfit;color:var(--navy);line-height:1.1}
.flyer .ln{height:9px;border-radius:5px;background:#E2E8F0;margin-top:9px}
.flyer .img{height:84px;border-radius:10px;margin:14px 0 6px;background:linear-gradient(135deg,#BAE6FD,#FBCFE8)}
[data-only]{opacity:0;transform:translateX(60px) rotate(2deg);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
[data-only].on{opacity:1;transform:none}
.vis{position:absolute;left:740px;top:150px;width:490px;height:460px;display:flex;align-items:center;justify-content:center}
.vcard{background:#fff;border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.16);padding:20px 22px;font-size:15px;color:var(--ink)}
.vcard h4{font:800 20px Outfit;color:var(--navy);margin-bottom:12px}
.aiArrow{position:absolute;left:204px;top:100px;width:84px;text-align:center;font:800 16px Outfit;color:var(--purple)}

/* ---------- character animation (runs each time a slide comes on) ---------- */
.pulseB,.zap,.chiselArm,.sparks,.flame,.hop,.platen,.sheetOut,.floaty,.app,.drift,.upA,.downA,.ping,.convoy,.wheelBig,.wheelSmall,.legL,.legR,.bobA,.bobB,.waveArm,.blink,.heart,.cloudA,.cloudB{transform-box:fill-box}
.cur .chiselArm{transform-origin:0% 50%;animation:chisel .45s ease-in-out infinite alternate}
@keyframes chisel{from{transform:rotate(-14deg)}to{transform:rotate(8deg)}}
.cur .sparks{animation:spark .45s ease-out infinite}
@keyframes spark{0%,55%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:translate(-8px,-10px) scale(.6)}}
.cur .flame{transform-origin:50% 100%;animation:flick .38s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.9,1.13) skewX(3deg)}}
.cur .hop{transform-origin:50% 100%;animation:hop 1.1s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:none}75%{transform:translateY(-12px)}}
.cur .lever{transform-box:view-box;transform-origin:303px 140px;animation:lever 1.6s ease-in-out infinite}
@keyframes lever{0%,100%{transform:rotate(0)}45%{transform:rotate(22deg)}}
.cur .platen{animation:platen 1.6s ease-in-out infinite}
@keyframes platen{0%,100%{transform:none}45%{transform:translateY(40px)}}
.cur .sheetOut{animation:sheet 1.6s ease-in-out infinite}
@keyframes sheet{0%,50%{opacity:0;transform:none}60%{opacity:1}100%{opacity:0;transform:translate(150px,-120px) rotate(18deg)}}
.cur .floaty{animation:floaty 3s ease-in-out infinite alternate}.cur .f2{animation-delay:-1s}.cur .f3{animation-delay:-2s}
@keyframes floaty{from{transform:translateY(0) rotate(0)}to{transform:translateY(-14px) rotate(2deg)}}
.cur .app{transform-origin:50% 50%;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.cur .drift{animation:floaty 3.4s ease-in-out infinite alternate}
.cur .upA{animation:upA 1.2s ease-in-out infinite}.cur .downA{animation:downA 1.2s ease-in-out infinite}
@keyframes upA{0%{transform:translateY(8px);opacity:.2}60%{opacity:1}100%{transform:translateY(-8px);opacity:.2}}
@keyframes downA{0%{transform:translateY(-8px);opacity:.2}60%{opacity:1}100%{transform:translateY(8px);opacity:.2}}
.cur .ping{transform-origin:50% 50%;animation:ping 1.8s ease-out infinite}.cur .p2{animation-delay:.9s}
@keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(3.4);opacity:0}}
/* robots: roll in from the left, wheels turning, then wave */
.cur .convoy{animation:rollIn 4.6s cubic-bezier(.25,.6,.3,1) both}
@keyframes rollIn{from{transform:translateX(-600px)}to{transform:none}}
.cur .wheelBig{transform-origin:50% 50%;animation:spinBig 4.6s cubic-bezier(.25,.6,.3,1) both}
@keyframes spinBig{from{transform:rotate(-553deg)}to{transform:rotate(0)}}
.cur .wheelSmall{transform-origin:50% 50%;animation:spinSmall 4.6s cubic-bezier(.25,.6,.3,1) both}
@keyframes spinSmall{from{transform:rotate(-2148deg)}to{transform:rotate(0)}}
.cur .legL{transform-origin:50% 0%;animation:step .38s ease-in-out 12 alternate}
.cur .legR{transform-origin:50% 0%;animation:step .38s ease-in-out 12 alternate-reverse}
@keyframes step{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.cur .bobA,.cur .bobB{animation:bob .38s ease-in-out 12 alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.cur .waveArm{transform-origin:0% 100%;animation:wave .5s ease-in-out 4.6s infinite alternate}
@keyframes wave{from{transform:rotate(-10deg)}to{transform:rotate(22deg)}}
.cur .blink{animation:blink 1s steps(2,jump-none) infinite}.cur .b2{animation-delay:.5s}
@keyframes blink{50%{opacity:.25}}
.cur .pulseB{animation:beat 1.2s ease-in-out infinite}.cur .zap{animation:pop .5s cubic-bezier(.3,1.6,.5,1) .4s both}
.cur .heart{transform-origin:50% 50%;animation:beat 1s ease-in-out 4.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.cur .cloudA{animation:cloud 9s ease-in-out infinite alternate}.cur .cloudB{animation:cloud 11s ease-in-out infinite alternate-reverse}
@keyframes cloud{to{transform:translateX(40px)}}

/* ---------- player chrome ---------- */
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;max-width:min(1100px,92vw);background:rgba(11,42,64,.92);color:#fff;font-size:21px;line-height:1.35;padding:10px 20px;border-radius:12px;text-align:center}
#cap.off,#cap:empty{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;height:58px;background:#081F30;display:flex;align-items:center;gap:10px;padding:0 16px;color:#CBD5E1;font:600 14px Outfit}
#bar button{background:#12344D;color:#fff;border:0;border-radius:9px;padding:9px 14px;font:600 14px Outfit;cursor:pointer;min-width:44px}
#bar button[aria-pressed="false"]{opacity:.55}
#prog{flex:1;height:6px;background:#12344D;border-radius:3px;overflow:hidden}
#progI{height:100%;width:0;background:linear-gradient(90deg,var(--ocean),var(--pink));transition:width .4s}
</style>
</head>
<body>
<script type="text/plain" id="mapSrc"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LDAH Pacific Reach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2A3A; --ink2:#3D5A6B; --mute:#6F8794; --line:#D9E6EB;
  --paper:#FBFAF6; --card:#FFFFFF;
  --ocean1:#F2FAFB; --ocean2:#CFE9EF; --ocean3:#A9D7E2;
  --teal:#0E7C86; --teal2:#14A3A8; --deep:#0B4F6C; --sand:#F3EBD8; --sandEdge:#C9B488; --land:#E7EFD9; --landEdge:#9DB48A;
  --purple:#7C3AED; --purple2:#A78BFA; --amber:#D97706;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:12px 20px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff, var(--paper))}
.kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700}
h1{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.1;margin:2px 0 3px;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--teal)}
.asof{font-size:11.5px;color:var(--mute)}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;background:#EEF4F6;border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;font:600 12px var(--sans);color:var(--ink2);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--deep);box-shadow:0 1px 3px rgba(11,79,108,.18)}
.tour{border:0;background:var(--deep);color:#fff;font:600 12px var(--sans);padding:8px 14px;border-radius:999px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.tour:hover{background:var(--teal)}
.tour svg{width:12px;height:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
header>*{min-width:0;max-width:100%}
.seg{max-width:100%}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--ocean1)}
#map{width:100%;height:100%;display:block;touch-action:manipulation}
.crumbs{position:absolute;top:12px;left:14px;display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:4px 6px;font-weight:600;font-size:12px;box-shadow:0 2px 10px rgba(15,42,58,.06)}
.crumbs button{border:0;background:none;font:inherit;color:var(--teal);cursor:pointer;padding:3px 8px;border-radius:999px}
.crumbs button:hover{background:#E6F4F5}
.crumbs button.cur{color:var(--ink);cursor:default;background:none}
.crumbs .sep{color:#AFC3CB}
.legend{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:11px;color:var(--ink2);box-shadow:0 4px 18px rgba(15,42,58,.07);max-width:300px}
.legend h4{margin:0 0 6px;font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend .dot{width:11px;height:11px;border-radius:50%;flex:none}
.legend svg{display:block}
.scalebar{position:absolute;right:14px;bottom:14px;font-size:10.5px;color:var(--ink2);text-align:right;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.scalebar .bar{height:5px;border:1.5px solid var(--ink2);border-top:0;margin-top:3px}
.insight{position:absolute;top:56px;right:14px;width:236px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:10px 12px;box-shadow:0 6px 22px rgba(15,42,58,.09);font-size:12px;color:var(--ink2);transition:opacity .5s, transform .5s}
.insight b{color:var(--ink)}
.insight .big{font:600 22px var(--serif);color:var(--amber);line-height:1.1;margin:2px 0}
.insight .k{font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.insight.hide{opacity:0;transform:translateY(-6px);pointer-events:none}
.caption{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:9px 16px;border-radius:999px;font:500 13px var(--sans);box-shadow:0 6px 20px rgba(11,79,108,.3);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.caption.show{opacity:1}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;box-shadow:0 8px 26px rgba(15,42,58,.16);font-size:12px;color:var(--ink2);opacity:0;transition:opacity .12s;min-width:140px;z-index:5}
.tip .t{font:600 14px var(--serif);color:var(--ink)}
.tip .n{font:700 13px var(--sans);color:var(--teal);margin-top:2px}
.tip .n.p{color:var(--purple)}
.tip .s{font-size:11px;color:var(--mute);margin-top:1px}
/* rail */
aside{border-left:1px solid var(--line);background:var(--card);overflow-y:auto;padding:16px 18px 24px;min-height:0}
aside::-webkit-scrollbar{width:8px}aside::-webkit-scrollbar-thumb{background:#DCE7EB;border-radius:8px}
.hero{display:flex;align-items:baseline;gap:8px}
.hero .num{font:600 40px/1 var(--serif);color:var(--deep);letter-spacing:-.02em}
.hero .lbl{font-size:12px;color:var(--ink2)}
.split{display:flex;height:8px;border-radius:6px;overflow:hidden;margin:10px 0 6px;background:#EEF3F5}
.split span{display:block;height:100%}
.splitkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink2)}
.splitkey i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.sec{margin-top:18px}
.sec h3{font:700 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 small{letter-spacing:0;text-transform:none;font-weight:500;font-size:10.5px}
.rowb{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:7px;cursor:pointer}
.rowb:hover{background:#F1F8F9}
.rowb .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowb .nm small{display:block;font-weight:500;color:var(--mute);font-size:10.5px}
.rowb .track{height:7px;background:#EEF3F5;border-radius:5px;overflow:hidden}
.rowb .fill{height:100%;background:linear-gradient(90deg,var(--teal2),var(--deep));border-radius:5px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rowb .fill.p{background:linear-gradient(90deg,var(--purple2),var(--purple))}
.rowb .ct{text-align:right;font:700 12.5px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
ol.top{list-style:none;margin:0;padding:0;counter-reset:t}
ol.top li{counter-increment:t;display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:5px 6px;margin:0 -6px;border-radius:7px;cursor:pointer}
ol.top li:hover{background:#F1F8F9}
ol.top li::before{content:counter(t);font:600 12px var(--serif);color:var(--teal);text-align:center}
ol.top .c{font-weight:600;font-size:12.5px}
ol.top .c small{color:var(--mute);font-weight:500;margin-left:5px;font-size:11px}
ol.top .v{font:700 12.5px var(--sans);font-variant-numeric:tabular-nums}
.partner{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 8px;margin:0 -6px 4px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.partner:hover{background:#F6F2FE;border-color:#E6DAFD}
.partner .pn{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.partner .pn i{width:9px;height:9px;border-radius:50%;background:var(--purple);display:inline-block}
.partner .pv{font:700 12.5px var(--sans);color:var(--purple);text-align:right}
.partner .meta{grid-column:1/-1;font-size:10.5px;color:var(--mute);display:flex;gap:10px;padding-left:15px}
.partner .meta b{color:var(--ink2);font-weight:600}
.offmap{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12px}
.offmap .v{font-weight:700;text-align:right}
.offmap small{display:block;color:var(--mute);font-size:10.5px}
.notes{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mute);line-height:1.5}
.notes p{margin:0 0 6px}
.notes b{color:var(--ink2)}
.back{border:0;background:#EEF4F6;color:var(--teal);font:600 12px var(--sans);padding:5px 10px;border-radius:999px;cursor:pointer;margin-bottom:10px}
.ititle{font:600 28px/1.05 var(--serif);color:var(--ink);margin:0}
.isub{font-size:12px;color:var(--ink2);margin-top:4px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:#F5FAFB;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.stat .v{font:600 22px var(--serif);color:var(--deep)}
.stat .k{font-size:10.5px;color:var(--mute)}
.hood{padding-left:22px !important}
.hood .nm{font-weight:500 !important;color:var(--ink2)}
/* svg */
.isl{cursor:pointer;transition:fill .25s}
.isl:hover,.isl.hl{fill:#DCEBC9}
.bub{cursor:pointer;transition:opacity .45s}
.bub circle.b{fill:rgba(14,124,134,.78);stroke:#fff}
.bub.p circle.b{fill:rgba(124,58,237,.80)}
.bub.hiagg circle.b{fill:rgba(14,124,134,.5)}
.bub.nz circle.b{fill:rgba(255,255,255,.55);stroke:var(--teal)}
.bub:hover circle.b{fill:rgba(11,79,108,.92)}
.bub.p:hover circle.b{fill:rgba(91,33,182,.95)}
.bub.nz:hover circle.b{fill:rgba(14,124,134,.18)}
.bub.pulse circle.b{animation:pulse 1.1s ease-in-out 3}
@keyframes pulse{50%{fill:var(--amber)}}
.lbl{font-family:var(--sans);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:rgba(251,250,246,.92);stroke-linejoin:round;pointer-events:none;transition:opacity .45s}
.lbl .cnt{fill:var(--teal);font-weight:700}
.lbl.p .cnt{fill:var(--purple)}
.ilbl{font-family:var(--serif);font-style:italic;fill:#5E7D5A;pointer-events:none;paint-order:stroke;stroke:rgba(242,250,251,.85);stroke-linejoin:round}
.olbl{font-family:var(--sans);font-weight:600;letter-spacing:.3em;text-transform:uppercase;fill:#7FAFBF;pointer-events:none}
.glbl{font-family:var(--sans);fill:#7FA3B0;pointer-events:none}
.heat{pointer-events:none;mix-blend-mode:multiply;transition:opacity .45s}
.fade{opacity:0;pointer-events:none}
.still *{transition:none !important;animation:none !important}
@media (max-width:1000px){
  body{overflow:auto}
  .app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  .seg{flex-wrap:wrap}
  h1 em{white-space:normal}
  .mapwrap{height:68vh;min-height:420px}
  aside{border-left:0;border-top:1px solid var(--line)}
  header{flex-direction:column;align-items:flex-start;padding:12px 16px}
  .controls{justify-content:flex-start}
  .insight{display:none}
}
@media (max-width:560px){
  h1{font-size:20px}
  .legend{max-width:190px;font-size:10px;padding:7px 9px}
  .legend svg{display:none}
  .scalebar{display:none}
  .controls{gap:6px}
  .seg button{padding:5px 9px;font-size:11px}
}

function itemFrame(it,px){

  if(it.kind==='nz')it.c.setAttribute('stroke-dasharray',`${3*px} ${2.2*px}`);
  it.h.setAttribute('r',Math.max(0,r*2.7*px));
  const fs=it.kind==='hiagg'?14:it.kind==='p'?12:11.5;
  it.t.setAttribute('font-size',fs*px);it.t.setAttribute('stroke-width',3.2*px);
  const R=rpx(it,it.g); let tx=it.x+(R+4)*px, ty=it.y+fs*.35*px, anc='start';
  const lp=it.lp||'r';
  if(lp==='b'){tx=it.x;ty=it.y+(R+fs+1)*px;anc='middle';}
  else if(lp==='bl'){tx=it.x-(R+3)*px;ty=it.y+(R+fs*.6)*px;anc='end';}

function layoutLabels(px){

  const list=groups[g].filter(it=>it.lblOn).sort((a,b)=>val(b.n[layer])-val(a.n[layer]));
  const inside=b=>b.x>=vb.x&&b.y>=vb.y&&b.x+b.w<=vb.x+vb.w&&b.y+b.h<=vb.y+vb.h;
  const hit=b=>!inside(b)||boxes.some(o=>b.x<o.x+o.w&&b.x+b.w>o.x&&b.y<o.y+o.h&&b.y+b.h>o.y);
  for(const it of list){
    const fs=11.5, R=rpx(it,g)*Math.min(1,it.grow||0), txt=(it.ts.textContent+it.tc.textContent);
    const w=txt.length*fs*.6*px, h=fs*1.15*px, gap=3*px;
    const cands=[
      [it.x+R*px+gap, it.y+fs*.35*px, 'start', it.x+R*px+gap, it.y-h/2],
      [it.x-R*px-gap, it.y+fs*.35*px, 'end', it.x-R*px-gap-w, it.y-h/2],

/* ---------- viewBox ---------- */
function boxToVB(box){
  const [n,s,w,e]=box; const [x0,y0]=P(n,w), [x1,y1]=P(s,e);
  let bw=x1-x0,bh=y1-y0; const W=svg.clientWidth||1000,H=svg.clientHeight||700;
  const pad=view==='pacific'?1.02:1.08; bw*=pad;bh*=pad;
  const cx=(x0+x1)/2, cy=(y0+y1)/2; const ar=W/H;
  if(bw/bh>ar)bh=bw/ar; else bw=bh*ar;
  return {x:cx-bw/2,y:cy-bh/2,w:bw,h:bh};
}
function setVB(v){vb=v;svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);}
let anim=null;
function animateTo(target,dur=1400){
  const from=Object.assign({},vb), t0=performance.now();
  const fcx=from.x+from.w/2,fcy=from.y+from.h/2,tcx=target.x+target.w/2,tcy=target.y+target.h/2;
  const lw0=Math.log(from.w),lw1=Math.log(target.w);
  anim={step(now){let t=Math.min(1,(now-t0)/dur);const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    const w=Math.exp(lw0+(lw1-lw0)*e),h=w*(target.h/target.w);
    // centre follows zoom so the motion feels like flying, not sliding
    const zf=(Math.log(from.w)-Math.log(w))/((lw0-lw1)||1);const ce=isFinite(zf)?Math.min(1,Math.max(0,zf)):e;
    const cx=fcx+(tcx-fcx)*ce,cy=fcy+(tcy-fcy)*ce;
    setVB({x:cx-w/2,y:cy-h/2,w,h}); if(t>=1)anim=null;}};
}

/* ---------- frame loop ---------- */
function pxPerUnit(){return vb.w/(svg.clientWidth||1000);}
function frame(now){
  if(anim)anim.step(now);
  const px=pxPerUnit();
  for(const f of scaleList)f(px);
  // grow
  const gt=(now-growStart);
  for(const k in groups)for(const it of groups[k]){
    if(k===growGroup){const t=Math.min(1,Math.max(0,(gt-it.i*28)/700));it.grow=t<=0?0:easeOutBack(t);} else if(it.grow<1&&k!==growGroup){it.grow=1;}
    itemFrame(it,px);
  }
  layoutLabels(px);
  // arcs flow
  const showArcs=vb.w>150;
  gArcs.style.opacity=showArcs?1:0;
  if(showArcs){for(const a of arcs){if(!a.len)a.len=a.base.getTotalLength();
    a.flow.setAttribute('stroke-dashoffset',-(now/40)*a.px);
    const t=((now/4200)+a.phase)%1;const p=a.base.getPointAtLength(t*a.len);a.dot.setAttribute('cx',p.x);a.dot.setAttribute('cy',p.y);a.dot.style.opacity=Math.sin(t*Math.PI).toFixed(2);}}
  gDate.style.opacity=vb.w>150?1:0; gGrat.style.opacity=vb.w>120?1:.0; gGhost.style.opacity=vb.w>120?1:0;
  ilblHawaii.style.opacity=vb.w<200?1:0;
  scalebar(px);
  requestAnimationFrame(frame);
}
function scalebar(px){
  const unitsPerMile=S/69.0; const target=110*px/unitsPerMile; // miles for ~110px
  const nice=[1,2,5,10,20,25,50,100,200,250,500,1000,2000];let m=nice[0];for(const v of nice)if(v<=target)m=v;
  $('#sbBar').style.width=(m*unitsPerMile/px)+'px';$('#sbLbl').textContent=m.toLocaleString('en-US')+' miles';
}

function moveTip(e){const r=wrap.getBoundingClientRect();let x=e.clientX-r.left+14,y=e.clientY-r.top+14;const tw=tip.offsetWidth,th=tip.offsetHeight;if(x+tw>r.width-8)x=e.clientX-r.left-tw-14;if(y+th>r.height-8)y=e.clientY-r.top-th-14;tip.style.left=x+'px';tip.style.top=y+'px';}

/* ---------- clocks ---------- */
function clock(tz){const d=new Date(Date.now()+tz*3600e3);const day=d.toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'});const t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'UTC'});
  const hi=new Date(Date.now()-10*3600e3);const diff=Math.round((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(hi.getUTCFullYear(),hi.getUTCMonth(),hi.getUTCDate()))/864e5);
  return `${day} ${t}`+(diff>0?' (tomorrow)':diff<0?' (yesterday)':'');}

  const c=$('#crumbs');c.innerHTML='';
  const items=[['pacific','Pacific']];if(view!=='pacific')items.push(['hawaii','Hawaiʻi']);if(ISL[view])items.push([view,ISL[view].name]);
  items.forEach(([k,lbl],i)=>{if(i){const s=document.createElement('span');s.className='sep';s.textContent='›';c.appendChild(s);}
    const b=document.createElement('button');b.textContent=lbl;if(k===view)b.className='cur';else b.onclick=()=>go(k);c.appendChild(b);});
  if(view==='pacific'){const s=document.createElement('span');s.className='sep';s.textContent='·';c.appendChild(s);const b=document.createElement('button');b.textContent='Zoom into Hawaiʻi';b.onclick=()=>go('hawaii');c.appendChild(b);}
}
let capT=null;
function caption(txt,ms=3200){const c=$('#caption');c.textContent=txt;c.classList.add('show');clearTimeout(capT);capT=setTimeout(()=>c.classList.remove('show'),ms);}

/* ---------- legend ---------- */
function renderLegend(){
  const g=groupForView(view); const samples=g==='pacific'?[1000,50]:g==='state'?[200,25]:[75,10];
  const f=RF[g], sk=sizeK(); const rs=samples.map(n=>(f.b+Math.sqrt(n)*f.f)*sk); const H=Math.ceil(rs[0]*2+4);
  let circles='',x=rs[0]+2;
  samples.forEach((n,i)=>{const r=rs[i];circles+=`<circle cx="${rs[0]+2}" cy="${H-2-r}" r="${r}" fill="none" stroke="#0E7C86" stroke-width="1"/><line x1="${rs[0]+2}" x2="${rs[0]*2+12}" y1="${H-2-2*r}" y2="${H-2-2*r}" stroke="#9FB6BF" stroke-dasharray="2 2"/><text x="${rs[0]*2+15}" y="${H-2-2*r+3.5}" font-size="10" fill="#3D5A6B">${n.toLocaleString('en-US')}</text>`;});
  $('#legend').innerHTML=`<h4>Bubble = ${LAYER_WORD[layer]}</h4><svg width="${rs[0]*2+50}" height="${H}">${circles}</svg>
  <div class="row"><span class="dot" style="background:rgba(14,124,134,.8)"></span>Hawaiʻi contacts by ZIP</div>
  <div class="row"><span class="dot" style="background:rgba(124,58,237,.8)"></span>Pacific partner contacts</div>
  ${g!=='pacific'?'<div class="row"><span class="dot" style="border:1.5px dashed #0E7C86;background:#fff"></span>ZIP not recorded (island known)</div>':''}
  <div class="row" style="color:#6F8794">Places with 1 or 2 people show as “&lt;3”.</div>`;
}

/* ---------- insight card ---------- */
function rate(k){const t=D.islands[k].total[layer];return t!==0?val(t)/ISL[k].pop*1000:0;}
function rateTxt(k){if(D.islands[k].total[layer]===-1)return '<1';const r=rate(k);return r<0.1?'<0.1':r.toFixed(1);}
function renderInsight(){
  const box=$('#insight'); if(view!=='hawaii'||layer==='members'){box.classList.add('hide');return;}
  const rates=ORDER.map(k=>[k,rate(k)]).filter(r=>D.islands[r[0]].total[layer]>=10).sort((a,b)=>b[1]-a[1]);
  if(!rates.length){box.classList.add('hide');return;}
  const [tk,tr]=rates[0]; const oahu=rate('Oahu');
  const mult=oahu>0?tr/oahu:0;
  box.innerHTML=`<div class="k">Per resident</div><div class="big">${tr.toFixed(1)} per 1,000</div><b>${ISL[tk].name}</b> has the deepest reach for its size: ${fmt(D.islands[tk].total[layer])} ${LAYER_WORD[layer]} among about ${ISL[tk].pop.toLocaleString('en-US')} residents${tk!=='Oahu'&&mult>1.5?`, roughly <b>${Math.round(mult)}×</b> Oʻahu’s rate`:''}.`;
  box.classList.remove('hide');
}

/* ---------- rail ---------- */
function bar(pct,purple){return `<div class="track"><div class="fill${purple?' p':''}" data-w="${Math.max(2,pct)}"></div></div>`;}
function animateBars(){requestAnimationFrame(()=>rail.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'));}
function renderRail(){
  if(ISL[view]) return renderIslandRail(view);
  const L=layer, T=D.allTotal[L], HI=D.hiTotal[L];
  const PT=val(D.partnerTotal[L]), OFF=val(D.offTotal[L]);
  const tv=val(T)||1;
  let h=`<div class="hero"><div class="num">${fmt(T)}</div><div class="lbl">${LAYER_WORD[L]} in the contact list</div></div>
  <div class="split"><span style="width:${val(HI)/tv*100}%;background:var(--teal)"></span><span style="width:${PT/tv*100}%;background:var(--purple)"></span><span style="width:${OFF/tv*100}%;background:#C9D6DC"></span></div>
  <div class="splitkey"><span><i style="background:var(--teal)"></i>Hawaiʻi ${fmt(HI)}</span><span><i style="background:var(--purple)"></i>Pacific partners ${fmt(D.partnerTotal[L])}</span><span><i style="background:#C9D6DC"></i>Off-island or unknown ${fmt(D.offTotal[L])}</span></div>`;
  // islands
  const imax=Math.max(...ORDER.map(k=>val(D.islands[k].total[L])))||1;
  h+=`<div class="sec"><h3>By island <small>per 1,000 residents</small></h3>`;
  for(const k of [...ORDER].sort((a,b)=>val(D.islands[b].total[L])-val(D.islands[a].total[L]))){const t=D.islands[k].total[L];
    h+=`<div class="rowb" data-go="${k}" data-hl="${k}"><div class="nm">${ISL[k].name}<small>${t!==0?rateTxt(k)+' per 1,000':'none recorded'}</small></div>${bar(val(t)/imax*100)}<div class="ct">${fmt(t)}</div></div>`;}
  h+=`</div>`;
  // top 10 cities
  const cs=D.cities.filter(c=>c.n[L]).sort((a,b)=>val(b.n[L])-val(a.n[L])).slice(0,10);
  h+=`<div class="sec"><h3>Top 10 cities &amp; towns <small>by ZIP</small></h3><ol class="top">`;
  for(const c of cs)h+=`<li data-go="${c.i}" data-city="${c.c}"><span class="c">${c.c}<small>${ISL[c.i].name}</small></span><span class="v">${fmt(c.n[L])}</span></li>`;
  h+=`</ol></div>`;
  // partners
  h+=`<div class="sec"><h3>Pacific partners <small>contacts · distance · local time</small></h3>`;
  for(const pt of [...PARTNERS].sort((a,b)=>val((D.partner[b.k]||{})[L]||0)-val((D.partner[a.k]||{})[L]||0))){const n=(D.partner[pt.k]||{})[L]||0;const s=D.partnerStaff[pt.k];
    h+=`<div class="partner" data-partner="${pt.k}"><div class="pn"><i></i>${pt.name}<span style="font-weight:500;color:var(--mute);font-size:11px">${pt.place}</span></div><div class="pv">${fmt(n)}</div><div class="meta"><span><b>${pt.miles.toLocaleString('en-US')}</b> mi</span><span class="clk" data-tz="${pt.tz}">${clock(pt.tz)}</span>${s&&L==='all'?`<span>${fmt(s)} staff card${s===1?'':'s'}</span>`:''}</div></div>`;}
  h+=`</div>`;
  // off map
  const nzT=ORDER.reduce((s,k)=>s+val(D.islands[k].noZip[L]||0),0);
  h+=`<div class="sec"><h3>Not pinned to a town</h3><div class="offmap">
   <div>ZIP not recorded<small>island known · dashed rings on the Hawaiʻi map</small></div><div class="v">${nzT}</div>
   <div>Off-island / mainland<small>outside Hawaiʻi and not a partner contact</small></div><div class="v">${fmt(D.offIsland[L])}</div>
   <div>Location unknown<small>no ZIP and no island recorded</small></div><div class="v">${fmt(D.unknown[L])}</div></div></div>`;
  h+=notes();
  rail.innerHTML=h; wireRail(); animateBars();
}
function renderIslandRail(k){
  const L=layer, I=D.islands[k];
  const ps=D.places.filter(p=>p.i===k&&p.n[L]);
  // group Honolulu hoods
  const rows=[];const cityAgg=D.cities.filter(c=>c.i===k&&c.n[L]).sort((a,b)=>val(b.n[L])-val(a.n[L]));
  const max=Math.max(1,...cityAgg.map(c=>val(c.n[L])));
  let h=`<button class="back" data-go="hawaii">‹ All islands</button><h2 class="ititle">${ISL[k].name}</h2>
  <div class="isub">${cityAgg.length} ${cityAgg.length===1?'town':'towns'} with ${LAYER_WORD[L]} · about ${ISL[k].pop.toLocaleString('en-US')} residents</div>
  <div class="statgrid"><div class="stat"><div class="v">${fmt(I.total[L])}</div><div class="k">${LAYER_WORD[L]} on ${ISL[k].name}</div></div>
  <div class="stat"><div class="v">${I.total[L]!==0?rateTxt(k):'0'}</div><div class="k">per 1,000 residents</div></div>
  <div class="stat"><div class="v">${fmt(I.zip[L])}</div><div class="k">placed by ZIP</div></div>
  <div class="stat"><div class="v">${fmt(I.noZip[L])}</div><div class="k">ZIP not recorded</div></div></div>
  <div class="sec"><h3>Cities &amp; towns <small>tap to find on the map</small></h3>`;
  for(const c of cityAgg){
    h+=`<div class="rowb" data-city="${c.c}"><div class="nm">${c.c}</div>${bar(val(c.n[L])/max*100)}<div class="ct">${fmt(c.n[L])}</div></div>`;
    if(c.split){for(const p of ps.filter(p=>p.c===c.c&&p.h).sort((a,b)=>val(b.n[L])-val(a.n[L])))
      h+=`<div class="rowb hood" data-hood="${p.h}"><div class="nm">${p.h}</div>${bar(val(p.n[L])/max*100)}<div class="ct">${fmt(p.n[L])}</div></div>`;}
  }
  if(!cityAgg.length)h+=`<div style="color:var(--mute)">No ${LAYER_WORD[L]} with a ZIP here yet.</div>`;
  h+=`</div>`+notes();
  rail.innerHTML=h; wireRail(); animateBars();
}
function notes(){return `<div class="notes">
  <p><b>Who is counted.</b> Every contact in LDAH Internal that is not archived (${D.archived} archived records left out). Contacts are the families, professionals and community members LDAH serves; cross-platform staff and partner cards are included.</p>
  <p><b>How places are found.</b> Hawaiʻi contacts are placed by their ZIP code (Honolulu ZIPs are shown as neighbourhoods when you zoom into Oʻahu). Where the ZIP is blank but the island is recorded, they sit in a dashed ring at the island centre.</p>
  <p><b>Pacific partner contacts</b> are counted from the partner stamp, which records <i>whose work</i> the contact belongs to (American Samoa, Guam, CNMI, FSM, Marshall Islands, Palau). It is ownership, not a home address.</p>
  <p><b>Privacy.</b> Aggregate counts only, no names or addresses. Any place with 1 or 2 people shows as “&lt;3”. Paid members follow the same rule, so most member counts read “&lt;3”.</p>
  <p><b>Per 1,000 residents</b> uses approximate 2020 Census island populations. Island shapes are stylised, not survey-accurate.</p></div>`;}
function wireRail(){
  rail.querySelectorAll('[data-go]').forEach(e=>e.addEventListener('click',()=>{const k=e.dataset.go;const city=e.dataset.city;go(k);if(city)setTimeout(()=>pulseCity(city),1300);}));
  rail.querySelectorAll('[data-hl]').forEach(e=>{e.addEventListener('mouseenter',()=>hlIsland(e.dataset.hl,true));e.addEventListener('mouseleave',()=>hlIsland(e.dataset.hl,false));});
  rail.querySelectorAll('.rowb[data-city]:not([data-go]),.rowb[data-hood]').forEach(e=>e.addEventListener('click',()=>{e.dataset.hood?pulseHood(e.dataset.hood):pulseCity(e.dataset.city);}));
  rail.querySelectorAll('[data-partner]').forEach(e=>e.addEventListener('click',()=>{const pt=PARTNERS.find(p=>p.k===e.dataset.partner);if(view!=='pacific')go('pacific');partnerFocus(pt);
    const it=groups.pacific.find(i=>i.partner===pt);if(it){it.el.classList.remove('pulse');void it.el.getBBox();it.el.classList.add('pulse');}}));
}
function pulse(list){list.forEach(it=>{it.el.classList.remove('pulse');void it.el.getBBox();it.el.classList.add('pulse');});}
function pulseCity(c){pulse(groups[groupForView(view)].filter(it=>it.city===c&&it.kind==='c'));}
function pulseHood(h){pulse(groups.detail.filter(it=>it.label===h));}
setInterval(()=>rail.querySelectorAll('.clk').forEach(e=>e.textContent=clock(+e.dataset.tz)),30000);

/* ---------- controls ---------- */
document.querySelectorAll('#layerSeg button').forEach(b=>b.onclick=()=>{layer=b.dataset.l;document.querySelectorAll('#layerSeg button').forEach(x=>x.classList.toggle('on',x===b));refreshItems(true);renderRail();renderLegend();renderInsight();});
document.querySelectorAll('#styleSeg button').forEach(b=>b.onclick=()=>{style=b.dataset.s;document.querySelectorAll('#styleSeg button').forEach(x=>x.classList.toggle('on',x===b));refreshItems(false);});

/* ---------- tour ---------- */
let touring=false;
$('#tourBtn').onclick=async()=>{
  if(touring)return;touring=true;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const L='all'; if(layer!==L)document.querySelector('#layerSeg button[data-l="all"]').click();
  const steps=[
    ['pacific',`${fmt(D.allTotal.all)} contacts across Hawaiʻi and six Pacific partner areas`],
    ['hawaii',`${fmt(D.hiTotal.all)} in Hawaiʻi · ${D.hiWithZip.toLocaleString('en-US')} placed by ZIP code`],
    ['Oahu',`Oʻahu: ${fmt(D.islands.Oahu.total.all)} · Honolulu split into its neighbourhoods`],
    ['Hawaii',`Hawaiʻi Island: ${fmt(D.islands.Hawaii.total.all)} · Hilo, Keaʻau and Pāhoa lead the way`],
    ['Molokai',`Molokaʻi: ${fmt(D.islands.Molokai.total.all)} people · the deepest reach per resident`],
    ['Maui',`Maui: ${fmt(D.islands.Maui.total.all)} so far`],
    ['Kauai',`Kauaʻi: ${fmt(D.islands.Kauai.total.all)} so far`],
    ['pacific','Back out to the Pacific']];
  for(const [v,txt] of steps){go(v,{dur:1700});caption(txt,3600);await wait(3900);}
  touring=false;
};

/* ---------- boot ---------- */
buildItems();
{const q=new URLSearchParams(location.search);if(q.get('layer'))layer=q.get('layer');if(q.get('style'))style=q.get('style');if(/^heat/.test(window.__V||''))style='heat';
 document.querySelectorAll('#layerSeg button').forEach(x=>x.classList.toggle('on',x.dataset.l===layer));document.querySelectorAll('#styleSeg button').forEach(x=>x.classList.toggle('on',x.dataset.s===style));}
setVB(boxToVB(VIEWS.pacific.box));
{const h=String(window.__V||decodeURIComponent(location.hash.slice(1))).replace(/^heat-?/,'');go(VIEWS[h]?h:'pacific',{dur:10});}
window.addEventListener('resize',()=>{setVB(boxToVB(VIEWS[view].box));renderLegend();});
requestAnimationFrame(frame);
setTimeout(()=>caption('Tap Hawaiʻi to zoom in · tap any bubble for its count',4200),900);
})();

const REACH=['One cave','The village','Everywhere we serve'];
function ERA(o){

  return `<div class="stripe"></div><div class="artCard">${o.art}</div>
  <div class="eraTxt"><div class="k">${o.kick}</div><div class="yr">${o.yr}</div><h2>${o.h}</h2><p data-s="2">${o.p}</p></div>
  <div class="reach"><div class="lbl">How far one idea could reach</div><div class="track">${segs}</div><div class="where">${REACH[o.reach]}</div></div>`;
}

let si=0, st=0, playing=false, voiceOn=true, timer=null, token=0;
const SAY_FIX=[[/ʻŌlelo/g,'Oh-lelo'],[/Hawaiʻi/g,'Hawaii'],[/ʻ/g,''],[/\bLDAH\b/g,'L D A H'],[/\bIDEA\b/g,'I D E A'],[/\bPIP\b/g,'pip'],[/\bQR\b/g,'Q R'],[/\bAI\b/g,'A I']];
function speakText(t){SAY_FIX.forEach(([a,b])=>t=t.replace(a,b));return t;}
function render(){
  S.forEach((s,i)=>s.el.classList.toggle('cur',i===si));
  const s=S[si], step=s.steps[st];
  const lvl=step.s||(st+1);
  s.el.querySelectorAll('[data-s]').forEach(e=>e.classList.toggle('on',+e.dataset.s<=lvl));
  s.el.querySelectorAll('[data-only]').forEach(e=>e.classList.toggle('on',+e.dataset.only===lvl));
  document.getElementById('capText').textContent=step.say;
  if(s.onStep) s.onStep(lvl, s.el);
  const total=S.reduce((a,x)=>a+x.steps.length,0), done=S.slice(0,si).reduce((a,x)=>a+x.steps.length,0)+st+1;
  document.getElementById('progI').style.width=(done/total*100)+'%';
  document.getElementById('count').textContent=`${si+1} / ${S.length}`;
  if(playing) narrate();
}
function stopVoice(){ token++; clearTimeout(timer); try{speechSynthesis.cancel();}catch(e){} }
let VOICE=null;
function pickVoice(){ try{const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
  const pref=[v=>v.name==='Google US English',v=>/Ava/.test(v.name)&&/(Premium|Enhanced)/.test(v.name),v=>/Microsoft (Aria|Jenny|Ava).*Natural/.test(v.name),v=>/Samantha/.test(v.name)&&/(Premium|Enhanced)/.test(v.name),v=>/^Ava/.test(v.name),v=>/Karen/.test(v.name),v=>/Samantha/.test(v.name),v=>v.lang==='en-US',v=>/^en/.test(v.lang)];
  for(const p of pref){const m=vs.find(p); if(m) return m;} return null;}catch(e){return null;} }
try{VOICE=pickVoice(); speechSynthesis.onvoiceschanged=()=>{VOICE=pickVoice();};}catch(e){}
function narrate(){
  stopVoice(); const my=token; const text=S[si].steps[st].say;
  const words=text.split(/\s+/).length, t0=Date.now(); let finished=false;
  const finish=()=>{ if(finished||my!==token) return; finished=true; clearTimeout(guard);
    const min=words*280, e=Date.now()-t0; timer=setTimeout(()=>{ if(my===token&&playing) advance(); }, Math.max(0,min-e)+700); };
  const guard=setTimeout(finish, words*520+4000); // always move on, even if the voice never reports it finished
  if(!voiceOn || !('speechSynthesis' in window)){ clearTimeout(guard); timer=setTimeout(()=>{ if(my===token&&playing) advance(); }, words*330+900); return; }
  if(!VOICE) VOICE=pickVoice();
  const parts=speakText(text).match(/[^.!?]+[.!?]*/g)||[text]; let i=0;
  const next=()=>{ if(my!==token||finished) return; if(i>=parts.length){ finish(); return; }
    const u=new SpeechSynthesisUtterance(parts[i++].trim());
    if(VOICE){u.voice=VOICE;u.lang=VOICE.lang;} else u.lang='en-US';
    u.rate=(VOICE&&/Google/.test(VOICE.name))?0.98:1.0; u.onend=next; u.onerror=next; speechSynthesis.speak(u); };
  setTimeout(()=>{ if(my===token) next(); }, 60);
}
function advance(){ if(st<S[si].steps.length-1){st++;render();} else if(si<S.length-1){si++;st=0;render();} else setPlaying(false); }
function back(){ if(st>0) st--; else if(si>0){si--;st=S[si].steps.length-1;} render(); }
function go(i,j){ stopVoice(); si=Math.max(0,Math.min(S.length-1,i)); st=j||0; render(); }
function setPlaying(p){ playing=p; const b=document.getElementById('play'); b.innerHTML=p?'&#10074;&#10074;':'&#9654;'; b.setAttribute('aria-label',p?'Pause':'Play'); if(p) narrate(); else stopVoice(); }
/* iPad/iPhone only allow speech that starts inside a tap, so speak a silent word right in the tap handler */
function unlockVoice(){ try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){} }
const Deck={play(){ unlockVoice(); if(si===0){ si=1; st=0; render(); } setPlaying(true); }, manual(){ setPlaying(false); go(1,0); }};
window.Deck=Deck;
document.getElementById('beginPlay').onclick=()=>Deck.play();
document.getElementById('beginManual').onclick=()=>Deck.manual();
document.getElementById('play').onclick=()=>playing?setPlaying(false):Deck.play();
document.getElementById('next').onclick=()=>{ stopVoice(); advance(); };
document.getElementById('prev').onclick=()=>{ stopVoice(); back(); };
document.getElementById('voice').onclick=e=>{ voiceOn=!voiceOn; e.currentTarget.setAttribute('aria-pressed',voiceOn); e.currentTarget.textContent=voiceOn?'Voice on':'Voice off'; if(playing) narrate(); };
document.getElementById('cc').onclick=e=>{ const c=document.getElementById('cap'); c.classList.toggle('off'); e.currentTarget.setAttribute('aria-pressed',!c.classList.contains('off')); };
document.getElementById('fs').onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(e){} };
addEventListener('keydown',e=>{ if(e.key===' '){e.preventDefault();playing?setPlaying(false):Deck.play();} else if(e.key==='ArrowRight'){stopVoice();advance();} else if(e.key==='ArrowLeft'){stopVoice();back();}
  else if(e.key==='v'||e.key==='V') document.getElementById('voice').click(); else if(e.key==='c'||e.key==='C') document.getElementById('cc').click(); else if(e.key==='f'||e.key==='F') document.getElementById('fs').click(); });
if(/still/.test(location.search)){const z=document.createElement('style');z.textContent='*{transition:none!important;animation:none!important}';document.head.appendChild(z);}
/* #9 or #9.3 opens scene 9 (1-based) at step 3, for rehearsing one slide */
{const m=location.hash.match(/^#(\d+)(?:\.(\d+))?$/); if(m){ si=Math.max(0,Math.min(S.length-1,m[1]-1)); st=Math.max(0,Math.min(S[si].steps.length-1,(m[2]||1)-1)); }}
render();
